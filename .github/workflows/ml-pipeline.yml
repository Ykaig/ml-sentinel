name: ML Pipeline

# Trigger: this workflow runs when called by another workflow
on:
  workflow_call:

# Jobs: the operations to execute
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the code from the repository that triggered the pipeline
      - name: Checkout Caller Repo Code
        uses: actions/checkout@v4

      # Step 2: Reads and prints the configuration file for verification
      - name: Read and Display Model Config
        run: |
          echo "--- Reading model configuration ---"
          cat config/model_config.yaml
          echo "---------------------------------"

      # Step 3: Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Step 4: Installs project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dummy Training Script
        run: python src/train.py --config-path config/model_config.yaml