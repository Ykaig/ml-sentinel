name: ML Pipeline

# Trigger: this workflow runs when called by another workflow
on:
  workflow_call:
    secrets:
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
      GCP_REGION:
        required: true
      ARTIFACT_REGISTRY_REPO:
        required: true

# Jobs: the operations to execute
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checks out the code from the repository that triggered the pipeline
      - name: Checkout Caller Repo Code
        uses: actions/checkout@v4

      # Step 2: Reads and prints the configuration file for verification
      - name: Read and Display Model Config
        run: |
          echo "--- Reading model configuration ---"
          cat config/model_config.yaml
          echo "---------------------------------"

      # Step 3: Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Step 4: Installs project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Authenticate to Google Cloud
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # Step 7: Pull training data from DVC from gcp bucket
      - name: 'Pull DVC data'
        run: dvc pull --force

      - name: Run Training Script
        run: python src/train.py --config-path config/model_config.yaml

      # Step 8: Upload the 'artifacts' folder so it can be used in the next job
      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/


  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caller Repo Code
        uses: actions/checkout@v4

      # Download the artifacts that were created in the previous job
      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
      - name: 'Configure Docker'
        # Use the secrets directly in the command
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: 'Get Model Name'
        id: get_model_name
        run: echo "MODEL_NAME=$(yq e '.model_name' config/model_config.yaml)" >> $GITHUB_OUTPUT

      - name: 'Build and Push Docker Image'
        run: |
          # Construct the image tag using the secrets
          IMAGE_TAG=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/${{ steps.get_model_name.outputs.MODEL_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ steps.get_model_name.outputs.MODEL_NAME }}
          region: ${{ secrets.GCP_REGION }}
          # Construct the full image path again for deployment
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/${{ steps.get_model_name.outputs.MODEL_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'